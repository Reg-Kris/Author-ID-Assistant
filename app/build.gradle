apply plugin: 'com.android.application'

android {
    namespace 'app.smashsmashin.authoridassistant'
    compileSdkVersion 34

    defaultConfig {
        applicationId "app.smashsmashin.authoridassistant"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // No UI needed
    }

    if(project.hasProperty("signing.properties")
        && new File(project.property("signing.properties")).exists()) {

        Properties props = new Properties()
        props.load(new FileInputStream(new File(project.property("signing.properties"))))

        signingConfigs {
            release {
                storeFile file(props['keystore'])
                keyAlias props['keyAlias']
                storePassword props['keystore.password']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if(project.hasProperty("signing.properties")
                && new File(project.property("signing.properties")).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    
    // Android instrumentation testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
